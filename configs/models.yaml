# Candidate routers for the same rescue target. Fit all preprocessing and models
# on train only, with explicit feature columns and no passthrough. Use validation
# for comparison and documented tuning; keep test closed.
logistic_regression:
  enabled: true
random_forest:
  enabled: true
xgboost:
  enabled: true
vqc:
  enabled: false  # Optional QML dependencies; compact features first.
